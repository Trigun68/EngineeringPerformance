worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout 65;

    # Безопасные заголовки для SPA и API-прокси
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none';" always;

    # SPNEGO/Kerberos: в production смонтировать keytab и krb5.conf,
    # задать auth_gss_keytab и auth_gss_service_name (см. ngx_http_auth_gss_module).
    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # Раскомментировать после настройки keytab в production:
        # auth_gss on;
        # auth_gss_keytab /etc/nginx/http.keytab;
        # auth_gss_service_name HTTP/hostname.example.com@REALM.EXAMPLE.COM;

        location /api/ {
            client_max_body_size 10m;
            proxy_pass http://api:8080/api/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Remote-User $remote_user;
            # При Spnego:Enabled=true задайте тот же секрет в API (Spnego__TrustedProxySecret)
            proxy_set_header X-Trusted-Proxy-Token ${PROXY_TRUSTED_SECRET};
            proxy_read_timeout 300s;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
