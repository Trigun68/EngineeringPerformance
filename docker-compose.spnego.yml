# SPNEGO / Kerberos SSO — overlay на тот же образ frontend (не подменять nginx.conf).
# Использование: docker compose -f docker-compose.yml -f docker-compose.spnego.yml up -d
#
# Базовый client/nginx.conf.template рендерится entrypoint (PROXY_TRUSTED_SECRET).
# Директивы auth_gss — include /etc/nginx/conf.d/spnego*.inc (маска: без файла образ стартует).
#
# Требования:
# - образ frontend с ngx_http_auth_spnego_module (stock nginx:alpine модуля нет — см. DEPLOY.md)
# - keytab с SPN HTTP/<hostname>
# - krb5.conf, PROXY_TRUSTED_SECRET (тот же, что Spnego__TrustedProxySecret)
#
# Подготовка keytab:
#   ktpass /princ HTTP/eng-perf.domain@DOMAIN /mapuser spnego_svc@domain /pass * /out http.keytab

services:
  frontend:
    volumes:
      - ${KEYTAB_PATH:-/etc/krb5.keytab}:/etc/nginx/http.keytab:ro
      - ${KRB5_CONF_PATH:-/etc/krb5.conf}:/etc/krb5.conf:ro
      - ./client/nginx/spnego.inc.example:/etc/nginx/conf.d/spnego.inc:ro
    environment:
      # Для реального SSO задать непустой секрет в .env (тот же, что у backend).
      PROXY_TRUSTED_SECRET: ${PROXY_TRUSTED_SECRET:-}

  backend:
    environment:
      Spnego__Enabled: "true"
      Spnego__TrustedProxySecret: ${PROXY_TRUSTED_SECRET:-}
      DevWindowsAuth__SimulatedWindowsUser: ""
