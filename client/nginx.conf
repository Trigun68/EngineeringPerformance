worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    sendfile        on;
    keepalive_timeout 65;

    # Ответы аналитики — десятки МБ однотипного JSON, бандлы — мегабайты JS.
    # Без сжатия это доминирует во времени загрузки страницы (ISS-018).
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    # Готовые .gz со сборки Vite: не сжимаем JS/CSS на лету.
    gzip_static on;
    gzip_types
        application/json
        application/javascript
        text/javascript
        text/css
        text/plain
        application/xml
        image/svg+xml
        application/manifest+json;

    # Cloudflare Tunnel передаёт https в X-Forwarded-Proto
    map $http_x_forwarded_proto $forwarded_proto {
        ""      $scheme;
        default $http_x_forwarded_proto;
    }

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none';" always;

    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # Раскомментировать для доменной среды (SPNEGO/Kerberos):
        # auth_gss on;
        # auth_gss_keytab /etc/krb5.keytab;

        location /api/ {
            client_max_body_size 50m;
            proxy_pass http://backend:8080/api/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header X-Remote-User $remote_user;
            proxy_read_timeout 300s;
        }

        # Vite хеширует имена: можно кэшировать навсегда. add_header в location
        # сбрасывает наследование server-заголовков — повторяем security headers.
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header X-Frame-Options "DENY" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none';" always;
        }

        location = /index.html {
            expires -1;
            add_header Cache-Control "no-cache" always;
            add_header X-Frame-Options "DENY" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none';" always;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
