name: E2E Playwright

on:
  push:
    branches: [master, main, feat/*, fix/*]
    paths:
      - 'client/**'
      - 'backend/**'
      - 'migrations/**'
      - 'docker-compose.yml'
      - 'docker-compose.ci.yml'
      - 'scripts/docker-db-init.sh'
      - '.github/workflows/e2e-tests.yml'
  pull_request:
    paths:
      - 'client/**'
      - 'backend/**'
      - 'docker-compose.yml'
      - 'docker-compose.ci.yml'

env:
  COMPOSE_FILE: docker-compose.yml:docker-compose.ci.yml
  SQL_SA_PASSWORD: Test_SA_password1!
  JWT_SECRET: test-jwt-secret-minimum-32-characters-long

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        working-directory: client
        run: npm ci

      - name: Client unit tests
        working-directory: client
        run: npm run test

      - name: Client build
        working-directory: client
        run: npm run build

      - name: Start stack
        run: |
          cp .env.example .env
          sed -i 's/^SQL_SA_PASSWORD=.*/SQL_SA_PASSWORD=Test_SA_password1!/' .env
          sed -i 's/^JWT_SECRET=.*/JWT_SECRET=test-jwt-secret-minimum-32-characters-long/' .env
          echo "WEB_PORT=8081" >> .env
          # Drop stale CI networks that may collide with compose IPAM pools.
          docker network rm ep-ci-edge 2>/dev/null || true
          docker compose up -d --build --wait || {
            echo "=== ep-db-init logs ==="
            docker logs ep-db-init || true
            echo "=== ep-backend logs (tail) ==="
            docker logs --tail 80 ep-backend || true
            echo "=== ep-frontend logs (tail) ==="
            docker logs --tail 40 ep-frontend || true
            exit 1
          }
          # Sanity: nomenclature + demo projects must exist after db-init.
          docker compose exec -T sqlserver /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$SQL_SA_PASSWORD" -C -d EngineeringPerformance -Q \
            "SET NOCOUNT ON; SELECT 'KFO' t, COUNT(*) c FROM PhysicalVolumesKfo UNION ALL SELECT 'Projects', COUNT(*) FROM Projects;"

      # Не run-e2e-docker.sh: nested `docker run` на GHA зависает на npm ci.
      - name: Install Playwright browsers
        working-directory: client
        run: npx playwright install --with-deps chromium

      - name: Playwright E2E
        working-directory: client
        run: E2E_BASE_URL=http://127.0.0.1:8081 npx playwright test
        timeout-minutes: 30

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            client/e2e-report/
            client/test-results/
          if-no-files-found: ignore

      - name: Stop stack
        if: always()
        run: docker compose down -v
