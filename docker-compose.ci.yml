# CI / GitHub Actions override.
# Production compose expects external Cloudflare network tech-lab24-edge;
# on runners that network does not exist — create a local bridge instead.
# Use 172.30.x (not 172.18): GHA runners often already have a 172.18.0.0/16 pool
# ("Pool overlaps with other one on this address space").
networks:
  tech-lab24-edge:
    external: false
    name: ep-ci-edge
    ipam:
      config:
        - subnet: 172.30.100.0/24

services:
  frontend:
    networks:
      tech-lab24-edge:
        ipv4_address: 172.30.100.8
